# Defaults for every experiment. Dataset/protocol configs `extends:` this file.
seed: 42
device: auto            # auto | cuda | cpu
output_dir: runs/experiment

# Unified label space shared by all domains (Cityscapes-19 by default).
classes: [road, sidewalk, building, wall, fence, pole, traffic_light, traffic_sign, vegetation, terrain,
          sky, person, rider, car, truck, bus, train, motorcycle, bicycle]
colors: [[128,64,128], [244,35,232], [70,70,70], [102,102,156], [190,153,153], [153,153,153], [250,170,30],
         [220,220,0], [107,142,35], [152,251,152], [70,130,180], [220,20,60], [255,0,0], [0,0,142], [0,0,70],
         [0,60,100], [0,80,100], [0,0,230], [119,11,32]]
ignore_index: 255

domains: {}              # name -> {include: datasets/<x>.yaml, root: ...} (see configs/datasets)
domain_order: []         # default protocol: one stage per domain, teacher_t = domain_t

data:
  eval_split: test       # which split of every domain is used for the R[stage, domain] matrix
  max_images_per_split: null   # e.g. 200 for quick debugging (seeded subsample)
  cache:                 # optional one-time resize to disk: much faster loading of 2K images
    enabled: false
    size: [512, 1024]
    dir: cache

loader: {batch_size: 4, num_workers: 4, pin_memory: true}

transforms:
  train:                 # teacher supervised training
    - {name: resize, size: [512, 1024]}
    - {name: random_scale, scale: [0.75, 1.25]}
    - {name: random_crop, size: [384, 768]}
    - {name: random_horizontal_flip, p: 0.5}
    - {name: color_jitter, brightness: 0.2, contrast: 0.2, saturation: 0.2}
    - {name: normalize}
  distill:               # student distillation (fixed size so replay can be concatenated)
    - {name: resize, size: [384, 768]}
    - {name: random_horizontal_flip, p: 0.5}
    - {name: normalize}
  eval:
    - {name: resize, size: [384, 768]}
    - {name: normalize}

eda:
  enabled: true
  max_images: 300        # per split; null = full scan
  example_images: 4

models:
  teacher: {encoder: resnet50, pretrained: true, output_stride: 16, width: 256}
  student: {encoder: mobilenet_v3_large, pretrained: true, width: 128}

teachers:
  dir: runs/teachers     # shared across ablation runs: teachers are trained once
  train: true            # train missing teachers; false = require checkpoints
  retrain: false
  shared_domains: []     # CDTDD "internal data": domains every teacher was also trained on
  per_teacher: {}        # name -> {train_on: [domains], checkpoint: path}
  epochs: 40
  batch_size: 4
  optimizer: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  scheduler: poly
  warmup_steps: 200
  amp: true
  grad_clip: 5.0
  eval_every: 1
  class_weights: null

protocol:
  stages: []             # empty = auto from domain_order; else [{name, teacher, distill_on, external, epochs}]
  eval_on: null          # null = every domain

distill:
  epochs: 10
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.01
  scheduler: poly
  warmup_steps: 100
  amp: true
  grad_clip: 5.0
  temperature: 2.0
  eval_every: 1          # validate every N epochs (always on the last epoch of a stage)

eval: {batch_size: 4, amp: true, max_batches: null, max_batches_epoch: null}  # *_epoch caps per-epoch val cost

metrics:
  boundary: true             # Boundary IoU (Cheng et al. 2021) per class, every validation
  boundary_ratio: 0.02       # boundary band width = ratio * image diagonal
  print_per_class: true      # per-class IoU / F1 / bIoU table every epoch
  epoch_eval_domains: seen   # seen = domains learned so far (for forgetting) | all

# ---------------------------------------------------------------------------------------
# Every component is an independent on/off switch (see METHOD.md). Full GOATED model:
components:
  teacher_kd: true              # 1  KD from current teacher            (CDTDD)
  old_student_kd: true          # 2  KD from previous student           (CDTDD/SE2D)
  exemplar_buffer: true         # 3  difficulty-ranked replay buffer    (DoSe)
  teacher_echo: true            # 4  stored teacher soft labels         (new)
  bn_layer_distill: true        # 5  BN stats student vs old student    (DoSe Eq.6)
  bn_domain_prototypes: true    # 6  BN stats vs domain prototype       (DoSe Eq.7)
  stats_aware_prototypes: true  # 7  Kalman/Welford prototype evolution (new)
  auto_domain_routing: true     # 8  data-free external-data routing    (new)
  entropy_gated_fusion: true    # 9  per-pixel confidence fusion        (new)
  class_prototype_replay: true  # 10 Gaussian class-feature replay
  stochastic_restore: false     # 11 Bernoulli weight restore           (DoSe/CoTTA)
  aug_pseudo_label: false       # 12 flip-averaged pseudo-label CE      (DoSe)
  supervised_ce: false          # 13 ground-truth CE (supervised DIL baseline)

hparams:
  weights: {teacher_kd: 1.0, old_student_kd: 1.0, echo: 1.0, replay: 1.0, bn_layer: 0.1, bn_domain: 0.1,
            class_proto: 0.1, aug_pseudo: 1.0, ce: 1.0}
  old_student_on: external      # when auto_domain_routing is off: external (SE2D) | all (self-distillation)
  fusion: {tau: 0.5}            # lower = trust confident sources more sharply
  routing: {calib_batches: 20, z: 2.0, sharpness: 0.5}
  buffer:
    per_stage: 40               # exemplars kept per stage
    priority: vog               # vog | entropy | random
    update_every: 10            # steps between buffer offers (VoG costs 2 extra backward passes)
    replay_every: 1
    replay_batch: 2
    echo_topk: 5
    echo_stride: 8              # echo resolution = input / stride
  prototypes:
    layers: 12                  # BN layers tracked (spread over depth) or "all"
    bank: {ema_momentum: 0.9, process_noise: 0.001, gate: 9.0, warmup: 8, shrinkage: 0.5, margin: 2.0}
  class_proto:
    samples_per_class: 32
    confidence: 0.7             # teacher confidence for pseudo-labels feeding the class bank
    bank: {max_pixels: 512, min_count: 50}
  restore: {p: 0.01}
  aug_pseudo: {threshold: 0.7}

reporting: {num_predictions: 4}
